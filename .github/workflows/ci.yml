name: EvidenceTool CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  quality-and-security:
    name: Lint, Types & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,test]"

      - name: Code Quality (Ruff)
        run: ruff check src/ tests/

      - name: Static Type Checking (Mypy Strict)
        run: mypy src/

      - name: Security SAST Scan (Bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Dependency Audit (pip-audit)
        run: pip-audit

  test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: quality-and-security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[test]"

      - name: Run Test Suite (Pytest with Coverage)
        run: |
          pytest --cov=evidencetool --cov-report=xml --cov-report=term-missing tests/

      - name: Verify JSON Output Schema & Live CLI Contract Validity
        run: |
          # 1. Verify Draft-07 Schema Definition Syntax
          python -c "
          import jsonschema, json
          schema = json.load(open('schemas/diagnosis-result.schema.json'))
          jsonschema.Draft7Validator.check_schema(schema)
          print('Schema definition is valid Draft-07!')
          "
          # 2. Verify Live CLI JSON Output Conformance Against Contract
          python -c "
          import subprocess, json, jsonschema
          schema = json.load(open('schemas/diagnosis-result.schema.json'))
          res = subprocess.run(['evidencetool', 'diagnose', 'network', '--output', 'json'], capture_output=True, text=True)
          data = json.loads(res.stdout)
          jsonschema.validate(instance=data, schema=schema)
          print('Live CLI JSON output strictly complies with diagnosis-result.schema.json!')
          "

  e2e-linux-systemd:
    name: E2E Linux, systemd & Nginx
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Ubuntu and Debian systemd E2E
        run: bash tests/e2e/run.sh

  e2e-docker:
    name: E2E Docker provider
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime package
        run: pip install -e .

      - name: Run Docker lifecycle E2E
        run: bash tests/e2e/run_docker_e2e.sh

  e2e-data:
    name: E2E data and dependency providers
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime package
        run: pip install -e .

      - name: Run data and dependency E2E
        run: bash tests/e2e/run_data_e2e.sh

  e2e-kubernetes:
    name: E2E Kubernetes provider
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime package
        run: pip install -e .

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest

      - name: Run Kubernetes Minikube E2E
        run: bash tests/e2e/run_k8s_e2e.sh

  e2e-ssh-transport:
    name: E2E SSH transport contract
    needs: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run SSH transport tests
        run: pytest tests/test_ssh_transport.py -q
