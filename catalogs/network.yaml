situations:
  NETWORK_HEALTHY:
    description: "Network endpoint is fully reachable and operational across all layers"
    signature:
      network.dns_resolvable: PASS
      network.route_exists: PASS
      network.host_reachable: PASS
      network.port_reachable: PASS

  NETWORK_DNS_FAILURE:
    description: "DNS resolution failed (domain unresolvable or resolver down)"
    signature:
      network.dns_resolvable: FAIL

  NETWORK_ROUTE_FAILURE:
    description: "DNS succeeded but no kernel network route exists to target host"
    signature:
      network.dns_resolvable: PASS
      network.route_exists: FAIL

  NETWORK_HOST_UNREACHABLE:
    description: "Target host is unreachable / does not respond to network probes"
    signature:
      network.dns_resolvable: PASS
      network.host_reachable: FAIL

  NETWORK_TCP_REFUSED:
    description: "Host is reachable but target TCP port is closed or connection refused"
    signature:
      network.host_reachable: PASS
      network.port_reachable: FAIL

  NETWORK_TLS_HANDSHAKE_FAILURE:
    description: "TCP port is open but TLS handshake failed (protocol mismatch or handshake error)"
    signature:
      network.port_reachable: PASS
      network.tls_handshake: FAIL

  NETWORK_HTTP_5XX:
    description: "TCP and TLS transport succeeded but HTTP upstream service returned 5xx server error"
    signature:
      network.port_reachable: PASS
      network.http_reachable: FAIL
