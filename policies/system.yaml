version: "1.0"
action: "start_heavy_job"
risk: "MEDIUM"
schema: "v2"

allow:
  - "PROCESS_HEALTHY"
  - "NETWORK_HEALTHY"

blocked_by:
  - "DISK_PRESSURE"
  - "NETWORK_UNREACHABLE"
  - "NETWORK_DNS_FAILURE"
  - "NETWORK_TCP_REFUSED"
  - "PROCESS_CRASHED"

required_evidence:
  - id: process.running
    on_unknown: IGNORE
  - id: process.zombie
    on_unknown: IGNORE
  - id: filesystem.disk_pressure
    on_unknown: IGNORE
  - id: network.host_reachable
    on_unknown: IGNORE
  - id: network.dns_resolvable
    on_unknown: IGNORE
  - id: network.port_reachable
    on_unknown: IGNORE

human_approval: false
