[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencetool"
version = "0.1.0"
description = "A read-only operational evidence and decision layer for diagnosing production incidents."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "cryptography>=41.0.0",
]

[project.scripts]
evidencetool = "evidencetool.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
