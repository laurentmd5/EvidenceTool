[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencetool"
version = "0.1.0"
description = "A read-only operational evidence and decision layer for diagnosing production incidents."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "cryptography>=41.0.0",
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.2",
    "pytest-cov>=5.0.0",
]

[project.scripts]
evidencetool = "evidencetool.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B108", "B404"]
