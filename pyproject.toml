[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencetool"
version = "1.0.4"
description = "A read-only operational evidence and decision layer for diagnosing production incidents."
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.2",
    "click==8.3.3",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "cryptography==50.0.0",
    "jsonschema==4.23.0",
]
dev = [
    "ruff==0.8.2",
    "mypy==1.14.0",
    "types-PyYAML==6.0.12.20241230",
    "bandit==1.8.0",
    "pip-audit==2.7.3",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.scripts]
evidencetool = "evidencetool.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B108", "B404"]
